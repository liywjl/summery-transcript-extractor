<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summery</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <nav class="tabs">
        <div class="tab-list" role="tablist" aria-label="Summery views">
          <button class="tab" id="tab-page" type="button" role="tab" data-tab="page"></button>
          <button class="tab" id="tab-picked" type="button" role="tab" data-tab="picked"></button>
          <button class="tab" id="tab-saved" type="button" role="tab" data-tab="saved"></button>
        </div>
        <button class="icon-button is-small" id="settings" type="button" aria-label="Settings" title="Settings"></button>
      </nav>
      <section class="panel" id="panel" role="tabpanel"></section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
