<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summery</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" data-state="loading">
      <header class="top">
        <span class="kind" id="kind"></span>
        <button class="icon-button" id="settings" type="button" aria-label="Settings" title="Settings"></button>
      </header>

      <section class="summary">
        <h1 class="title" id="title"><span class="skeleton skeleton-title"></span></h1>
        <p class="facts" id="facts"><span class="skeleton skeleton-facts"></span></p>
      </section>

      <section class="preview" id="preview" aria-live="polite"></section>

      <footer class="actions">
        <button class="primary" id="copy-prompt" type="button" disabled></button>
        <button class="icon-button" id="copy-text" type="button" aria-label="Copy text only" title="Copy text only" disabled></button>
        <button class="icon-button" id="download" type="button" aria-label="Download Markdown" title="Download Markdown" disabled></button>
        <button class="icon-button" id="open-chat" type="button" disabled></button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
